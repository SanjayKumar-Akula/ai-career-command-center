{% extends '_app_base.html' %}{% block content %}<div class="page-head"><div><span class="section-label">Explore</span><h2>Jobs &amp; resources</h2><p class="sub">Trusted links for learning and the next application step.</p></div></div><div class="page-grid two"><section class="card"><h3 class="card-title">Learning resources</h3><div id="learning-resources"><div class="skeleton big"></div></div></section><section class="card"><h3 class="card-title">Job portals</h3><div id="job-portals"><div class="skeleton big"></div></div></section></div>{% endblock %}{% block scripts %}<script>document.addEventListener('DOMContentLoaded',async()=>{const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const r=(await ccApi.get('/api/resources')).data;const links=(items)=>(items||[]).map(x=>`<a class="data-row" target="_blank" rel="noopener noreferrer" href="${esc(x.url)}"><span><strong>${esc(x.name)}</strong><small>${esc(x.description)}</small></span><span>↗</span></a>`).join('')||'<div class="empty-state"><h3>No links yet</h3><p>Curated resources will appear here.</p></div>';document.getElementById('learning-resources').innerHTML=links(r.learning_resources);document.getElementById('job-portals').innerHTML=links(r.job_portals)}catch(e){document.getElementById('learning-resources').textContent=e.message;document.getElementById('job-portals').textContent=e.message}});</script>{% endblock %}
