{% extends '_app_base.html' %}{% block content %}<div class="page-head"><div><span class="section-label">Workspace</span><h2>Resume Vault</h2><p class="sub">Store versions, analyze ATS performance and compare improvements.</p></div></div><section class="card"><h3 class="card-title">Upload a resume</h3><form id="vault-upload-form" class="inline-form" enctype="multipart/form-data"><div class="field"><label for="resume-file">PDF resume</label><input id="resume-file" name="resume" type="file" accept="application/pdf,.pdf" required></div><div class="field"><label for="resume-role">Target role</label><input id="resume-role" name="target_role" placeholder="Software Developer" required></div><button class="btn btn-primary" type="submit">Upload and analyze</button></form><p id="resume-upload-error" class="form-error" hidden></p></section><section class="card"><h3 class="card-title">Your versions</h3><div id="resume-vault-state" class="skeleton big"></div><div id="resume-vault" hidden></div></section>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/resume.js') }}" defer></script>{% endblock %}
