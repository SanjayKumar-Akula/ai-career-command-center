{% extends '_app_base.html' %}{% block content %}<div class="page-head"><div><span class="section-label">Capability</span><h2>Skills</h2><p class="sub">Build a clear picture of what you know and what to strengthen.</p></div></div><section class="card"><h3 class="card-title">Add a skill</h3><p class="card-sub">Skills are normalized against the shared catalog and duplicates are ignored.</p><form id="skill-form" class="inline-form"><div class="field"><label for="skill-name">Skill name</label><input id="skill-name" placeholder="Python, SQL, React…" required></div><div class="field"><label for="skill-proficiency">Proficiency <span id="proficiency-value">40</span>%</label><input id="skill-proficiency" type="range" min="0" max="100" value="40"></div><button class="btn btn-primary" type="submit">Add skill</button></form></section><section class="card"><div class="card-title"><span>My skills</span><span id="skill-count" class="pill indigo">0</span></div><div id="skills-state" class="skeleton big"></div><div id="skills-table" hidden></div></section>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/skills.js') }}" defer></script>{% endblock %}
