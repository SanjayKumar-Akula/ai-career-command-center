<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose a new password · AI Career Command Center</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head>
<body class="auth-body"><main class="auth-layout compact"><section class="auth-panel"><a class="auth-brand" href="/">Career<span>AI</span></a><p class="eyebrow">Secure reset</p><h1>Choose a stronger password.</h1><p class="auth-copy">Your reset link is single-use and expires quickly.</p></section><section class="auth-card"><a class="mobile-brand" href="/">Career<span>AI</span></a><h2>Reset password</h2><p class="card-sub">Use at least 8 characters with a letter and a number.</p><form id="reset-form" novalidate><div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" required><p class="field-error" data-error="password"></p></div><div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required><p class="field-error" data-error="confirm_password"></p></div><p class="form-error" id="form-error" hidden></p><button class="btn btn-primary btn-block" type="submit"><span class="btn-label">Update password</span></button></form><div class="auth-links"><a href="/login">Back to sign in</a></div></section></main><script>window.RESET_TOKEN={{ token|tojson }};</script><script src="{{ url_for('static', filename='js/api.js') }}" defer></script><script src="{{ url_for('static', filename='js/auth.js') }}" defer></script></body></html>
