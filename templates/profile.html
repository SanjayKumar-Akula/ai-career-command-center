{% extends '_app_base.html' %}{% block content %}<div class="page-head"><div><span class="section-label">Account</span><h2>Career profile</h2><p class="sub">Keep your context current so the command center stays useful.</p></div></div><form id="profile-form" class="card" novalidate><div id="profile-error" class="form-error" hidden></div><div class="form-grid"><div class="field"><label for="full_name">Full name</label><input id="full_name" name="full_name" maxlength="120"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" disabled></div><div class="field"><label for="education">Education</label><input id="education" name="education" maxlength="200"></div><div class="field"><label for="college">College</label><input id="college" name="college" maxlength="200"></div><div class="field"><label for="degree">Degree</label><input id="degree" name="degree" maxlength="120"></div><div class="field"><label for="graduation_year">Graduation year</label><input id="graduation_year" name="graduation_year" maxlength="10"></div><div class="field"><label for="target_role">Target role</label><input id="target_role" name="target_role" maxlength="120" placeholder="Software Developer"></div><div class="field"><label for="preferred_job_type">Preferred job type</label><select id="preferred_job_type" name="preferred_job_type"><option value="">Select one</option><option>Full-time</option><option>Internship</option><option>Contract</option><option>Freelance</option></select></div><div class="field span-2"><label for="experience">Experience</label><textarea id="experience" name="experience" maxlength="1200" placeholder="Internships, work, projects, or practical experience"></textarea></div><div class="field span-2"><label for="career_goal">Career goal</label><textarea id="career_goal" name="career_goal" maxlength="600" placeholder="What do you want to achieve next?"></textarea></div></div><div class="btn-row"><button class="btn btn-primary" type="submit">Save profile</button><span id="profile-status" class="muted-block" role="status"></span></div></form>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/profile.js') }}" defer></script>{% endblock %}
