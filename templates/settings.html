{% extends '_app_base.html' %}{% block content %}<div class="page-head"><div><span class="section-label">Account</span><h2>Settings</h2><p class="sub">Manage your session and account preferences.</p></div></div><section class="card"><h3 class="card-title">Session security</h3><p class="card-sub">Your session uses HTTP-only cookies and CSRF protection for state-changing requests.</p><button id="settings-logout" class="btn btn-outline" type="button">Sign out</button></section>{% endblock %}{% block scripts %}<script>document.getElementById('settings-logout').addEventListener('click',async()=>{try{await ccApi.post('/api/auth/logout');location.href='/'}catch(e){alert(e.message)}});</script>{% endblock %}
